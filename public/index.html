<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AIE In & Out</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="role-page">
    <section class="role-card">
      <div class="brand">AIE</div>
      <p class="eyebrow">AIE IN & OUT</p>
      <h1>Who are you?</h1>
      <p class="subtitle">Choose how you want to continue.</p>

      <div class="role-options">
        <a class="role-option" href="/student-login.html">
          <span class="role-icon">🎓</span>
          <span class="role-copy">
            <strong>Student</strong>
            <small>Sign in with your student account</small>
          </span>
          <span class="arrow">→</span>
        </a>

        <a class="role-option teacher-option" href="/teacher.html">
          <span class="role-icon">👨‍🏫</span>
          <span class="role-copy">
            <strong>Teacher</strong>
            <small>Continue with the teacher PIN</small>
          </span>
          <span class="arrow">→</span>
        </a>
      </div>
    </section>
  </main>

</html>
